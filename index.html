<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Until 25</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="container">
        <div class="theme-switcher">
            <input type="checkbox" id="theme-toggle">
            <label for="theme-toggle"><span></span></label>
        </div>
        <h1>Time Until You Turn 25</h1>
        <div class="input-container">
            <label for="dob">Enter your Date of Birth:</label>
            <input type="text" id="dob" placeholder="Select your birth date...">
        </div>
        <div id="countdown" class="countdown-container">
            <div class="time-card">
                <span id="days">0</span>
                <div class="label">Days</div>
            </div>
            <div class="time-card">
                <span id="hours">0</span>
                <div class="label">Hours</div>
            </div>
            <div class="time-card">
                <span id="minutes">0</span>
                <div class="label">Minutes</div>
            </div>
            <div class="time-card">
                <span id="seconds">0</span>
                <div class="label">Seconds</div>
            </div>
        </div>
        <p id="result-message"></p>
        <p id="quote"></p>

        <div class="share-container">
            <button id="share-button">Share</button>
            <div id="share-menu" class="share-menu hidden">
                <button id="download-btn">Download PNG</button>
                <button id="tweet-btn">Share on Twitter</button>
                <button id="linkedin-btn">Share on LinkedIn</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
